stages:
  - tests

tests-e2e:
  stage: tests
  image: mcr.microsoft.com/playwright:v1.49-noble-node-20
  script:
    - npm ci
    - npx bddgen
    - npx playwright test --project=chromium
  artifacts:
    when: always
    paths:
      - playwright-report/
      - allure-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 7 days